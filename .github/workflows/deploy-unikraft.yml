name: Deploy to Unikraft Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run (deploy or cleanup)'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - cleanup

permissions:
  contents: read

env:
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}

jobs:
  deploy:
    if: github.event.inputs.action != 'cleanup' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Unikraft CLI
        uses: unikraft/setup-action@main
      - name: Login
        run: echo $UKC_TOKEN | unikraft login --token -
      - name: Build & push image
        run: unikraft build . --output kaceygarman/my-node-app:latest
      - name: Deploy instance
        run: |
          unikraft run --metro fra \
            --name my-node-app-v4 \
            -p 443:3000/http+tls \
            -m 512M \
            --image kaceygarman/my-node-app:latest \
            -e YT_WARPOUT=true

  cleanup:
    if: (github.event.inputs.action == 'cleanup') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Unikraft CLI
        uses: unikraft/setup-action@main
      - name: Login
        run: echo $UKC_TOKEN | unikraft login --token -
      - name: List instances
        run: |
          echo "=== All instances ==="
          unikraft instance ls -o json 2>/dev/null | jq -r '.[] | [.name, .uuid, .state] | @tsv' || unikraft instance ls
      - name: Delete old instances (keep my-node-app-v4)
        run: |
          for NAME in my-node-app my-node-app-v2 my-node-app-v3; do
            UUID=$(unikraft instance ls -o json 2>/dev/null | jq -r '.[] | select(.name=="'"$NAME"'") | .uuid' | head -1)
            if [ -n "$UUID" ]; then
              echo "Deleting $NAME ($UUID)"
              unikraft instance rm -f "$UUID" || true
            else
              echo "No instance named $NAME"
            fi
          done
        continue-on-error: true
