name: Deploy to Unikraft Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Unikraft CLI
        uses: unikraft/setup-action@main

      - name: Login
        run: echo $UKC_TOKEN | unikraft login --token -

      - name: Build & push image
        run: unikraft build . --output kaceygarman/my-node-app:latest

      - name: Remove old instance (by name lookup)
        run: |
          OLD_UUID=$(unikraft instance ls -o json 2>/dev/null | jq -r '.[] | select(.name=="my-node-app") | .uuid' | head -1)
          OLD2_UUID=$(unikraft instance ls -o json 2>/dev/null | jq -r '.[] | select(.name=="my-node-app-v2") | .uuid' | head -1)
          for U in "$OLD_UUID" "$OLD2_UUID"; do
            if [ -n "$U" ]; then
              echo "Deleting old instance $U"
              unikraft instance rm -f "$U" || true
            fi
          done
        continue-on-error: true

      - name: Deploy instance
        run: |
          unikraft instance rm -f my-node-app 2>/dev/null || true
          unikraft run --metro fra \
            --name my-node-app-v2 \
            -p 443:3000/http+tls \
            -m 512M \
            --scale-to-zero policy=on,cooldown-time=5000,stateful=true \
            --image kaceygarman/my-node-app:latest
